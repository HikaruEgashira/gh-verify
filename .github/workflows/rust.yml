name: rust
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: rust-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 30
    runs-on: hikae-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        timeout-minutes: 5
        with:
          toolchain: 1.88.0
      # rust-cache queries `rustup toolchain list`; make sure a default
      # toolchain is registered so the query succeeds on the self-hosted runner.
      - name: Set default toolchain
        timeout-minutes: 5
        run: |
          rustup default 1.88.0
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        timeout-minutes: 5
      - name: Test
        timeout-minutes: 20
        run: cargo test --workspace --locked
      - name: Build
        timeout-minutes: 20
        run: cargo build --workspace --locked
