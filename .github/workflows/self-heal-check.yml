name: Self-heal checks
on:
  push:
    branches: [main]
    paths: ['.github/self-heal/**', '.github/workflows/*heal*.yml']
  pull_request:
    paths: ['.github/self-heal/**', '.github/workflows/*heal*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/self-heal/test_heal.py
