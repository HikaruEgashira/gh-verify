name: Reusable post-merge self-heal
on:
  workflow_call:
    inputs:
      automation_ref:
        description: Immutable gh-verify commit containing the repair implementation
        type: string
        required: true
      check_workflows:
        description: JSON list of existing workflows safe to validate on a repair branch
        type: string
        default: '[]'
      post_merge_workflows:
        description: JSON list of default-branch workflows to run after a repair merge
        type: string
        required: true
permissions: {}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      issue: ${{ steps.observe.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HikaruEgashira/gh-verify
          ref: ${{ inputs.automation_ref }}
          persist-credentials: false
      - id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/self-heal/heal.py observe
  repair:
    needs: report
    if: needs.report.outputs.issue != ''
    runs-on: [self-hosted, linux, arm64, hikae-economy]
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HikaruEgashira/gh-verify
          ref: ${{ inputs.automation_ref }}
          path: tools
          persist-credentials: false
      - name: Repair, validate through existing CI, merge and verify
        working-directory: repository
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_ISSUE: ${{ needs.report.outputs.issue }}
          CHECK_WORKFLOWS: ${{ inputs.check_workflows }}
          POST_MERGE_WORKFLOWS: ${{ inputs.post_merge_workflows }}
        run: python3 ../tools/.github/self-heal/heal.py repair
  repair-result:
    needs: [report, repair]
    if: always() && needs.report.outputs.issue != '' && needs.repair.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE: ${{ needs.report.outputs.issue }}
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number: Number(process.env.ISSUE),
              body: `Repair did not complete. The issue and any repair PR remain open. Inspect ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`});
