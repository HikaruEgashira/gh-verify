name: verify-repo
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mon 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  verify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./
        id: verify
        timeout-minutes: 5
        with:
          command: repo
          format: json
          policy: oss
          audit: "true"
