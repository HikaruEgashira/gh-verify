name: verify-repo
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mon 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  verify:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: ./
        id: verify
        timeout-minutes: 5
        with:
          command: repo
          format: json
          policy: oss
          audit: "true"
