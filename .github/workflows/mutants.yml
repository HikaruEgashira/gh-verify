name: mutants
on:
  push:
    branches: [main]
    paths:
      - "crates/cli/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutants:
    timeout-minutes: 5
    runs-on: hikae-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        timeout-minutes: 5
        with:
          toolchain: stable
      # rust-cache queries `rustup toolchain list`; make sure a default
      # toolchain is registered so the query succeeds on the self-hosted runner.
      - name: Set default toolchain
        timeout-minutes: 5
        run: |
          rustup default stable
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        timeout-minutes: 5
      - name: Install cargo-mutants
        timeout-minutes: 5
        run: cargo install cargo-mutants
      - name: Run mutation testing on gh-verify crate
        timeout-minutes: 5
        run: cargo mutants -p gh-verify --timeout 60
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: mutation-report
          path: mutants.out/
